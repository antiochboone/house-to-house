<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · House to House</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f3ea;
        color: #35392f;
        font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        text-align: center;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #211f19; color: #e8e3d5; }
      }
      .card { max-width: 340px; }
      .mark {
        width: 56px; height: 56px; margin: 0 auto 16px;
        border-radius: 14px; background: #4e9e5f;
        display: flex; align-items: center; justify-content: center;
        color: #fffdf8; font-size: 30px; font-weight: 700;
      }
      h1 { font-size: 21px; margin: 0 0 8px; }
      p { font-size: 14.5px; line-height: 1.6; opacity: 0.75; margin: 0 0 20px; }
      button {
        border: 0; border-radius: 12px; background: #4e9e5f; color: #fffdf8;
        font-size: 15px; font-weight: 600; padding: 12px 22px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">A</div>
      <h1>You're offline</h1>
      <p>House to House needs a connection to load. Check your signal and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
