<title>House to House — Design Prototype</title>
<style>
  :root {
    --bg: #FAF7F1;
    --surface: #FFFFFF;
    --surface-2: #F1EBDF;
    --ink: #333A33;
    --muted: #75796D;
    --faint: #A3A392;
    --line: #E5DFCE;
    --accent: #4E9E5F;
    --accent-ink: #2F6B3A;
    --accent-soft: #E4F0E1;
    --glow: rgba(78,158,95,.12);
    --tan-soft: #F0E4CC;
    --tan-ink: #8A6B32;
    --sprout: #4E9E5F;
    --sprout-soft: #E4F0E1;
    --gold: #B08A28;
    --gold-soft: #F3EAD0;
    --ember: #BF6A4E;
    --ember-soft: #F5E3DB;
    --dormant: #8F948A;
    --dormant-soft: #EAEAE2;
    --shadow: 0 1px 2px rgba(51,58,51,.05), 0 8px 24px rgba(51,58,51,.07);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #20231E; --surface: #2A2E27; --surface-2: #343931; --ink: #ECEAE0;
      --muted: #A6A996; --faint: #7C8071; --line: #3D4238; --accent: #83BD8B;
      --accent-ink: #AAD8B0; --accent-soft: #2D3B2D; --glow: rgba(131,189,139,.14);
      --tan-soft: #3E3727; --tan-ink: #DABC85;
      --sprout: #83BD8B; --sprout-soft: #2D3B2D; --gold: #D4AF52; --gold-soft: #3B3520;
      --ember: #D68F70; --ember-soft: #3D2A21; --dormant: #8F948A; --dormant-soft: #333630;
      --shadow: 0 1px 2px rgba(0,0,0,.25), 0 10px 30px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #20231E; --surface: #2A2E27; --surface-2: #343931; --ink: #ECEAE0;
    --muted: #A6A996; --faint: #7C8071; --line: #3D4238; --accent: #83BD8B;
    --accent-ink: #AAD8B0; --accent-soft: #2D3B2D; --glow: rgba(131,189,139,.14);
    --tan-soft: #3E3727; --tan-ink: #DABC85;
    --sprout: #83BD8B; --sprout-soft: #2D3B2D; --gold: #D4AF52; --gold-soft: #3B3520;
    --ember: #D68F70; --ember-soft: #3D2A21; --dormant: #8F948A; --dormant-soft: #333630;
    --shadow: 0 1px 2px rgba(0,0,0,.25), 0 10px 30px rgba(0,0,0,.3);
  }
  :root[data-theme="light"] {
    --bg: #FAF7F1; --surface: #FFFFFF; --surface-2: #F1EBDF; --ink: #333A33;
    --muted: #75796D; --faint: #A3A392; --line: #E5DFCE; --accent: #4E9E5F;
    --accent-ink: #2F6B3A; --accent-soft: #E4F0E1; --glow: rgba(78,158,95,.12);
    --tan-soft: #F0E4CC; --tan-ink: #8A6B32;
    --sprout: #4E9E5F; --sprout-soft: #E4F0E1; --gold: #B08A28; --gold-soft: #F3EAD0;
    --ember: #BF6A4E; --ember-soft: #F5E3DB; --dormant: #8F948A; --dormant-soft: #EAEAE2;
    --shadow: 0 1px 2px rgba(51,58,51,.05), 0 8px 24px rgba(51,58,51,.07);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  .display { font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; }
  .label { font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  /* ---------- Shell ---------- */
  .shell { display: flex; min-height: 100vh; }
  .side {
    width: 232px; flex-shrink: 0; padding: 22px 14px; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh;
  }
  .wordmark { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
  .wordmark svg { flex-shrink: 0; }
  .wordmark .wm-name { font-size: 19px; font-weight: 400; letter-spacing: .01em; line-height: 1.1; }
  .wordmark .wm-sub { font-size: 10.5px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }
  .nav-btn {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px;
    border-radius: 10px; color: var(--muted); font-weight: 500; text-align: left; font-size: 14.5px;
  }
  .nav-btn:hover { background: var(--surface-2); color: var(--ink); }
  .nav-btn.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .nav-btn .nv-ic { width: 18px; height: 18px; flex-shrink: 0; opacity: .85; }
  .side .spacer { flex: 1; }
  .role-box { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 8px; }
  .role-toggle { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; margin: 8px 0 10px; }
  .role-toggle button { flex: 1; padding: 6px 0; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .role-toggle button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .user-chip { display: flex; align-items: center; gap: 9px; padding: 4px 8px; }
  .user-chip .uc-meta { line-height: 1.25; }
  .user-chip .uc-name { font-size: 13px; font-weight: 600; }
  .user-chip .uc-role { font-size: 11.5px; color: var(--muted); }
  .proto-note { font-size: 10.5px; color: var(--faint); padding: 10px 8px 0; line-height: 1.5; }

  .avatar {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; letter-spacing: .02em;
    background: var(--surface-2); color: var(--muted);
  }
  .avatar.av-m { background: var(--accent-soft); color: var(--accent-ink); }
  .avatar.av-f { background: var(--tan-soft); color: var(--tan-ink); }

  .main { flex: 1; min-width: 0; padding: 30px 34px 80px; }
  .view-head { margin-bottom: 22px; display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
  .view-head .vh-text { max-width: 640px; }
  .view-head h1 { font-size: 27px; font-weight: 400; margin: 0 0 4px; text-wrap: balance; }
  .view-head p { margin: 0; color: var(--muted); font-size: 14.5px; }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; margin-left: auto; }
  .seg button { padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  /* ---------- Map view ---------- */
  .stat-strip { display: flex; flex-wrap: wrap; gap: 26px; margin-bottom: 24px; align-items: baseline; }
  .stat .st-num { font-size: 26px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .stat .st-num .st-dim { font-size: 15px; color: var(--faint); }
  .stat .st-lab { font-size: 12px; color: var(--muted); }
  .stat.alert .st-num { color: var(--ember); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-left: auto; }
  .legend .lg-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .map-wrap { display: grid; grid-template-columns: 1fr 280px; gap: 22px; align-items: start; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .g-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px 18px 16px; text-align: left; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 10px; width: 100%;
    transition: transform .15s ease, border-color .15s ease;
  }
  .g-card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .g-card .gc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .g-card h3 { margin: 0; font-size: 19px; font-weight: 400; line-height: 1.2; }
  .g-card .gc-meta { color: var(--muted); font-size: 13px; }
  .g-card .gc-leaders { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .g-card .gc-leaders .avatar { width: 24px; height: 24px; font-size: 9.5px; margin-right: -4px; }
  .member-dots { display: flex; flex-wrap: wrap; gap: 5px; padding: 2px 0; }
  .member-dots .dot { width: 10px; height: 10px; }
  .dot.in-d { background: var(--accent); }
  .dot.no-d { background: none; border: 1.5px solid var(--faint); }
  .dot.neutral { background: var(--faint); opacity: .5; }
  .insight { display: flex; gap: 7px; font-size: 13px; color: var(--muted); font-style: italic; align-items: baseline; }
  .insight .ins-mark { color: var(--accent); font-style: normal; flex-shrink: 0; }
  .lineage-tag { font-size: 11.5px; color: var(--faint); }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px;
    font-size: 11px; font-weight: 600; letter-spacing: .03em; white-space: nowrap;
  }
  .chip.s-start { background: var(--sprout-soft); color: var(--sprout); }
  .chip.s-build { background: var(--gold-soft); color: var(--gold); }
  .chip.s-plant { background: var(--ember-soft); color: var(--ember); }
  .chip.st { background: var(--surface-2); color: var(--muted); font-weight: 500; }
  .chip.st.wants { background: var(--sprout-soft); color: var(--sprout); }
  .chip.st.declined { background: var(--dormant-soft); color: var(--dormant); }
  .chip.st.invited { background: var(--gold-soft); color: var(--gold); }

  /* Engagement chart mode */
  .eng-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
  .eng-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 16px 12px; box-shadow: var(--shadow); }
  .eng-panel h3 { margin: 0 0 2px; font-size: 17px; font-weight: 400; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .eng-panel .ep-meta { font-size: 11.5px; color: var(--faint); margin-bottom: 10px; }
  .eng-table { display: grid; grid-template-columns: 84px 1fr 1fr; border-top: 1px solid var(--line); }
  .eng-table .et-head { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 7px 6px 4px; }
  .eng-table .et-head.men { color: var(--accent-ink); }
  .eng-table .et-head.women { color: var(--tan-ink); }
  .eng-row-label { font-size: 11px; color: var(--muted); font-weight: 600; padding: 8px 6px; border-top: 1px solid var(--line); display: flex; align-items: center; }
  .eng-cell { padding: 6px 4px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; }
  .eng-cell.men-cell { border-left: 1px dashed var(--line); }
  .name-chip { font-size: 11.5px; padding: 2.5px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .name-chip.m { background: var(--accent-soft); color: var(--accent-ink); }
  .name-chip.f { background: var(--tan-soft); color: var(--tan-ink); }
  .name-chip.dim { opacity: .6; }
  .eng-panel.unplaced { border-style: dashed; border-color: var(--ember); }
  .eng-panel.unplaced h3 { color: var(--ember); }

  /* Wins feed */
  .wins { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
  .wins h2 { margin: 0 0 4px; font-size: 17px; font-weight: 400; }
  .wins .wn-sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .win { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13.5px; line-height: 1.45; }
  .win .w-flame { flex-shrink: 0; margin-top: 2px; }
  .win .w-date { display: block; font-size: 11px; color: var(--faint); margin-top: 2px; }

  /* ---------- Drawer ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(30,32,26,.4); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%);
    background: var(--bg); border-left: 1px solid var(--line); z-index: 50;
    transform: translateX(102%); transition: transform .25s ease; overflow-y: auto; padding: 26px 26px 60px;
  }
  .drawer.open { transform: translateX(0); }
  .drawer .d-close { position: absolute; top: 18px; right: 18px; color: var(--muted); font-size: 20px; padding: 4px 10px; border-radius: 8px; }
  .drawer .d-close:hover { background: var(--surface-2); }
  .drawer h2 { font-size: 24px; font-weight: 400; margin: 6px 0 2px; }
  .drawer .d-meta { color: var(--muted); font-size: 13.5px; margin-bottom: 14px; }
  .d-section { margin-top: 22px; }
  .d-section > .label { display: block; margin-bottom: 9px; }
  .d-insights { display: flex; flex-direction: column; gap: 7px; }
  .roster-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .roster-row .rr-name { font-size: 14px; }
  .roster-row .rr-role { font-size: 11.5px; color: var(--faint); }
  .roster-row .rr-right { margin-left: auto; display: flex; gap: 5px; align-items: center; }
  .gender-key { display: flex; gap: 12px; font-size: 11.5px; color: var(--faint); margin-bottom: 6px; }
  .gender-key .gk { display: flex; align-items: center; gap: 5px; }
  .gender-key .gk .avatar { width: 14px; height: 14px; font-size: 0; }
  .d-line { border: none; border-top: 1px solid var(--line); margin: 4px 0; }
  .timeline { position: relative; padding-left: 18px; display: flex; flex-direction: column; gap: 12px; }
  .timeline::before { content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 2px; background: var(--line); border-radius: 2px; }
  .tl-item { position: relative; font-size: 13.5px; }
  .tl-item::before { content: ""; position: absolute; left: -18px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .tl-item .tl-date { font-size: 11px; color: var(--faint); display: block; }
  .ready-band { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
  .ready-band .rb-score { font-size: 26px; font-variant-numeric: tabular-nums; }
  .ready-band .rb-note { font-size: 12.5px; color: var(--muted); line-height: 1.4; }

  /* ---------- Discipleship view ---------- */
  .disc-wrap { display: grid; grid-template-columns: 1fr 300px; gap: 24px; align-items: start; }
  .tree-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .tree-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
  .tree-panel h2 { margin: 0 0 14px; font-size: 17px; font-weight: 400; }
  ul.tree, ul.tree ul { list-style: none; margin: 0; padding-left: 0; }
  ul.tree ul { padding-left: 22px; position: relative; }
  ul.tree ul::before { content: ""; position: absolute; left: 8px; top: 0; bottom: 12px; width: 2px; background: var(--line); border-radius: 2px; }
  .tree li { position: relative; padding: 3px 0; }
  .tree ul li::before { content: ""; position: absolute; left: -14px; top: 16px; width: 12px; height: 2px; background: var(--line); }
  .tree li.collapsed > ul { display: none; }
  .person {
    display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px 5px 6px;
    border-radius: 99px; background: var(--surface-2); font-size: 13px; border: none; cursor: default;
  }
  .person.has-kids { cursor: pointer; }
  .person.has-kids:hover { background: var(--glow); }
  .person .avatar { width: 22px; height: 22px; font-size: 9px; }
  .person .p-group { font-size: 11px; color: var(--faint); }
  .person .p-caret { font-size: 10px; color: var(--faint); width: 10px; }
  .person .p-count { display: none; font-size: 10.5px; font-weight: 700; color: var(--accent-ink); background: var(--accent-soft); border-radius: 99px; padding: 1px 7px; }
  li.collapsed > .person .p-count { display: inline-block; }
  .person.staff { background: var(--accent-soft); }
  .rail { display: flex; flex-direction: column; gap: 16px; }
  .rail-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
  .rail-panel h2 { margin: 0 0 3px; font-size: 16.5px; font-weight: 400; }
  .rail-panel .rp-sub { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .filter-chips button { border: 1px solid var(--line); border-radius: 99px; padding: 4px 11px; font-size: 12px; color: var(--muted); }
  .filter-chips button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .nd-row { display: flex; align-items: center; gap: 9px; padding: 7px 0; border-top: 1px solid var(--line); }
  .nd-row .nd-name { font-size: 13.5px; }
  .nd-row .nd-group { font-size: 11px; color: var(--faint); }
  .nd-row .chip { margin-left: auto; }
  .disc-stats { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }

  /* ---------- Follow-up view ---------- */
  .fu-stats { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
  .fu-list { display: flex; flex-direction: column; gap: 14px; }
  .fu-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
  .fu-top { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .fu-top .fu-name { font-size: 17px; }
  .fu-top .fu-desc { font-size: 13px; color: var(--muted); }
  .fu-top .fu-right { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .fu-contact { display: flex; gap: 14px; font-size: 12px; color: var(--faint); margin: 6px 0 12px 40px; flex-wrap: wrap; }
  .miles { display: flex; align-items: flex-start; margin-left: 40px; flex-wrap: wrap; row-gap: 10px; }
  .mile { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 86px; position: relative; }
  .mile::before { content: ""; position: absolute; top: 9px; left: -50%; width: 100%; height: 2px; background: var(--line); z-index: 0; }
  .mile:first-child::before { display: none; }
  .mile .m-dot {
    width: 20px; height: 20px; border-radius: 50%; background: var(--surface);
    border: 2px solid var(--line); z-index: 1; display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: transparent;
  }
  .mile.done .m-dot { background: var(--accent); border-color: var(--accent); color: #fff; }
  .mile.next .m-dot { border-color: var(--accent); border-style: dashed; }
  .mile .m-lab { font-size: 10.5px; color: var(--muted); text-align: center; line-height: 1.25; }
  .mile.done .m-lab { color: var(--ink); font-weight: 600; }
  .fu-note { margin: 10px 0 0 40px; font-size: 12.5px; color: var(--muted); font-style: italic; }

  /* ---------- Check-in view ---------- */
  .checkin-stage { display: flex; justify-content: center; padding-top: 6px; }
  .phone {
    width: 360px; max-width: 100%; background: var(--surface); border: 1px solid var(--line);
    border-radius: 26px; box-shadow: var(--shadow); padding: 26px 22px 22px;
    min-height: 560px; display: flex; flex-direction: column; position: relative; overflow: hidden;
  }
  .progress { display: flex; gap: 5px; justify-content: center; margin-bottom: 22px; }
  .progress .pg { width: 26px; height: 4px; border-radius: 4px; background: var(--line); transition: background .2s; }
  .progress .pg.done { background: var(--accent); }
  .step-eyebrow { text-align: center; margin-bottom: 8px; }
  .step-q { font-size: 21px; font-weight: 400; text-align: center; margin: 0 0 6px; text-wrap: balance; }
  .step-sub { text-align: center; color: var(--muted); font-size: 13.5px; margin: 0 0 20px; }
  .step-body { flex: 1; display: flex; flex-direction: column; gap: 9px; }
  .opt {
    border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; text-align: left;
    font-size: 14.5px; display: flex; align-items: center; gap: 10px; background: var(--surface);
    transition: border-color .12s, background .12s;
  }
  .opt:hover { border-color: var(--accent); }
  .opt.sel { border-color: var(--accent); background: var(--glow); font-weight: 600; }
  .opt .opt-check { margin-left: auto; color: var(--accent); font-weight: 700; opacity: 0; }
  .opt.sel .opt-check { opacity: 1; }
  .mood-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .mood-grid .opt { padding: 10px 8px; justify-content: center; font-size: 13.5px; }
  .mood-grid .opt .opt-check { display: none; }

          <span class="lg-item"><span class="dot no-d"></span> not yet</span>
          <span class="lg-item"><span class="chip s-start">Starting Up</span></span>
          <span class="lg-item"><span class="chip s-build">Building Up</span></span>
          <span class="lg-item"><span class="chip s-plant">Planting</span></span>
        </div>`
      : `<div class="legend">
          <span class="lg-item"><span class="chip s-start">Starting Up</span></span>
          <span class="lg-item"><span class="chip s-build">Building Up</span></span>
          <span class="lg-item"><span class="chip s-plant">Planting</span></span>
        </div>`)
    : `<div class="legend">
        <span class="lg-item"><span class="name-chip m">men</span></span>
        <span class="lg-item"><span class="name-chip f">women</span></span>
      </div>`;

  const modeToggle = role === "staff"
    ? `<div class="seg"><button class="${mapMode === "cards" ? "on" : ""}" onclick="setMapMode('cards')">Cards</button><button class="${mapMode === "chart" ? "on" : ""}" onclick="setMapMode('chart')">Engagement</button></div>`
    : "";

  const body = (mapMode === "chart" && role === "staff") ? renderEngChart() : renderCards();

  return `
    <div class="view-head">
      <div class="vh-text">
        <h1 class="display">${role === "staff" ? "Lifegroup Map" : "Lifegroups at Antioch Boone"}</h1>
        <p>${role === "staff"
          ? (mapMode === "chart"
            ? "Everyone in every group, by engagement — and who hasn't found a lifegroup home yet."
            : "Every lifegroup in the church — tap a house to step inside.")
          : "Find a group, see who leads it, help someone land in the right home."}</p>
      </div>
      ${modeToggle}
    </div>
    <div class="stat-strip">${role === "staff" ? staffStats : leaderStats}${legend}</div>
    ${body}`;
}

function renderCards() {
  const cards = GROUPS.map(g => {
    const ppl = groupPeople(g.id);
    const leaders = ppl.filter(p => p.role === "leader");
    const isMine = role === "leader" && g.id === LEADER_HOME;
    const showDetail = role === "staff" || isMine;
    const dots = ppl.map(p => {
      if (!showDetail) return `<span class="dot neutral"></span>`;
      return `<span class="dot ${inRelationship(p.name) ? "in-d" : "no-d"}" title="${esc(p.name)}"></span>`;
    }).join("");
    const insight = showDetail && g.insights.length
      ? `<div class="insight"><span class="ins-mark">◆</span><span>${esc(g.insights[0])}</span></div>` : "";
    return `<button class="g-card" onclick="openDrawer('${g.id}')" aria-label="Open ${esc(g.name)}">
      <div class="gc-top"><h3 class="display">${esc(g.name)}${isMine ? ' <span class="label" style="letter-spacing:.05em">· yours</span>' : ""}</h3>${seasonChip(g)}</div>
      <div class="gc-meta">${esc(g.meet)}</div>
      <div class="gc-leaders">${leaders.map(l => av(l.name)).join("")}<span style="margin-left:8px">${leaders.map(l => esc(firstName(l.name))).join(" & ")} · ${ppl.length} people</span></div>
      <div class="member-dots">${dots}</div>
      ${insight}
      ${g.lineage ? `<div class="lineage-tag">↳ ${esc(g.lineage)}</div>` : ""}
    </button>`;
  }).join("");

  const winsPanel = `
    <div class="wins">
      <h2 class="display">Wins</h2>
      <div class="wn-sub">What God's been doing, house to house</div>
      ${WINS.map(([t, d]) => `<div class="win">${flame}<div>${esc(t)}<span class="w-date">${d}</span></div></div>`).join("")}
    </div>`;

  return `<div class="map-wrap"><div class="card-grid">${cards}</div>${winsPanel}</div>`;
}

function renderEngChart() {
  const panels = GROUPS.map(g => {
    const ppl = groupPeople(g.id);
    const cell = (tier, gender) => {
      const names = ppl.filter(p => engTier(p) === tier && p.gender === gender)
        .map(p => `<span class="name-chip ${gender === "M" ? "m" : "f"} ${tier === "fringe" ? "dim" : ""}" title="${esc(p.name)}">${esc(firstName(p.name))}</span>`).join("");
      return `<div class="eng-cell ${gender === "M" ? "men-cell" : ""}">${names}</div>`;
    };
    const rows = TIERS.map(([tier, label]) =>
      `<div class="eng-row-label">${label}</div>${cell(tier, "F")}${cell(tier, "M")}`).join("");
    return `<div class="eng-panel">
      <h3 class="display">${esc(g.name)} ${seasonChip(g)}</h3>
      <div class="ep-meta">${ppl.length} people · ${esc(g.dgroups)} D-groups</div>
      <div class="eng-table">
        <div class="et-head"></div><div class="et-head women">Women</div><div class="et-head men">Men</div>
        ${rows}
      </div>
    </div>`;
  }).join("");

  const unplacedPanel = `
    <div class="eng-panel unplaced">
      <h3 class="display">Not yet in a lifegroup</h3>
      <div class="ep-meta">${UNPLACED.length} people we know of — the shepherding edge of the whole church</div>
      ${UNPLACED.map(u => `<div class="roster-row">${avG(u.name, u.gender)}
        <div><div class="rr-name">${esc(u.name)}</div><div class="rr-role">${esc(u.note)}</div></div></div>`).join("")}
    </div>`;

  return `<div class="eng-grid">${panels}${unplacedPanel}</div>`;
}

/* ================= DRAWER ================= */
function openDrawer(gid) {
  const g = groupById(gid);
  const ppl = groupPeople(gid);
  const isMine = role === "leader" && gid === LEADER_HOME;
  const showDetail = role === "staff" || isMine;
  const leaders = ppl.filter(p => ["leader", "intern", "worship"].includes(p.role));
  const members = ppl.filter(p => p.role === "member");
  const roleName = { leader: "Leader", intern: "Intern", worship: "Worship" };
  const row = p => {
    const right = showDetail
      ? (inRelationship(p.name)
          ? `<span class="dot in-d" title="in a discipleship relationship"></span>`
          : `<span class="chip ${STATUS_CLS[p.status] || "st"}">${STATUS_LABEL[p.status] || "not yet"}</span>`)
      : "";
    return `<div class="roster-row">${av(p.name)}
      <div><div class="rr-name">${esc(p.name)}</div>${roleName[p.role] ? `<div class="rr-role">${roleName[p.role]}</div>` : ""}</div>
      <div class="rr-right">${right}</div></div>`;
  };

  const insightBlock = showDetail ? `
    <div class="d-section"><span class="label">Insights</span>
      <div class="d-insights">${g.insights.map(i => `<div class="insight"><span class="ins-mark">◆</span><span>${esc(i)}</span></div>`).join("")}</div>
    </div>` : "";
  const readiness = showDetail && g.readiness ? `
    <div class="d-section"><span class="label">Planting readiness</span>
      <div class="ready-band"><div class="rb-score display">${g.readiness}<span style="color:var(--faint);font-size:15px">/15</span></div>
      <div class="rb-note">12+ means prepare to plant. Leadership balanced, locations set — worship leader for group two is the open item.</div></div>
    </div>` : "";
  const dgBlock = showDetail ? `
    <div class="d-section"><span class="label">Discipleship groups</span>
      <div style="font-size:14px">${esc(g.dgroups)} ${g.dgroups === "2 men's · 2 women's" ? '<span class="chip st wants" style="margin-left:6px">plant-ready pattern</span>' : ""}</div>
    </div>` : "";
  const historyBlock = showDetail ? `
    <div class="d-section"><span class="label">Story</span>
      <div class="timeline">${g.history.map(([d, t]) => `<div class="tl-item"><span class="tl-date">${d}</span>${esc(t)}</div>`).join("")}</div>
    </div>` : "";

  document.getElementById("drawer").innerHTML = `
    <button class="d-close" onclick="closeDrawer()" aria-label="Close">✕</button>
    ${seasonChip(g)}
    <h2 class="display">${esc(g.name)}</h2>
    <div class="d-meta">${esc(g.meet)} · ${ppl.length} people${g.lineage ? ` · ${esc(g.lineage)}` : ""}</div>
    ${insightBlock}
    ${readiness}
    <div class="d-section"><span class="label">Leadership team</span>
      <div class="gender-key"><span class="gk"><span class="avatar av-m"></span> men</span><span class="gk"><span class="avatar av-f"></span> women</span></div>
      ${leaders.map(row).join("")}</div>
    <hr class="d-line">
    <div class="d-section" style="margin-top:10px"><span class="label">Members</span>${members.map(row).join("")}</div>
    ${dgBlock}
    ${historyBlock}
    ${!showDetail ? `<div class="d-section proto-note" style="padding:0">Roster names only — health insights and discipleship detail are visible to staff and this group's own leaders.</div>` : ""}
  `;
  document.getElementById("drawer").classList.add("open");
  document.getElementById("scrim").classList.add("open");
}
function closeDrawer() {
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("scrim").classList.remove("open");
}

/* ================= DISCIPLESHIP VIEW ================= */
let ndFilter = "all";
function setNdFilter(f) { ndFilter = f; render(); }
function toggleBranch(el) {
  const li = el.closest("li");
  if (li && li.querySelector(":scope > ul")) li.classList.toggle("collapsed");
}
function countDesc(name) {
  const p = byName[name];
  return p.kids.length + p.kids.reduce((s, k) => s + countDesc(k), 0);
}
function treeNode(name) {
  const p = byName[name];
  const groupLabel = p.group ? groupById(p.group).name : "Staff";
  const hasKids = p.kids.length > 0;
  const kids = hasKids ? `<ul>${p.kids.map(k => `<li>${treeNode(k)}</li>`).join("")}</ul>` : "";
  return `<button class="person ${p.role === "staff" ? "staff" : ""} ${hasKids ? "has-kids" : ""}" ${hasKids ? `onclick="toggleBranch(this)" title="Collapse or expand this branch"` : ""}>
    ${hasKids ? '<span class="p-caret">▾</span>' : ""}${av(p.name)}<span>${esc(p.name)}</span><span class="p-group">${esc(groupLabel)}</span>${hasKids ? `<span class="p-count">+${countDesc(name)}</span>` : ""}
  </button>${kids}`;
}
function renderDisc() {
  const all = Object.values(byName).filter(p => p.group);
  const inD = all.filter(p => inRelationship(p.name));
  const notD = all.filter(p => !inRelationship(p.name));
  const roots = Object.values(byName).filter(p => p.kids.length && (!p.by || !byName[p.by]));
  const menRoots = roots.filter(p => p.gender === "M");
  const womenRoots = roots.filter(p => p.gender === "F");
  const counts = { all: notD.length };
  ["wants", "open", "invited", "declined", "none"].forEach(s => counts[s] = notD.filter(p => p.status === s).length);
  const filtered = ndFilter === "all" ? notD : notD.filter(p => p.status === ndFilter);
  const chipBtn = (f, lab) => `<button class="${ndFilter === f ? "on" : ""}" onclick="setNdFilter('${f}')">${lab} · ${counts[f]}</button>`;

  return `
    <div class="view-head"><div class="vh-text">
      <h1 class="display">Who is discipling whom</h1>
      <p>Every chain starts somewhere. Click any name to fold or unfold their branch.</p>
    </div></div>
    <div class="disc-stats">
      <div class="stat"><div class="st-num display">${inD.length}<span class="st-dim"> of ${all.length}</span></div><div class="st-lab">in a discipleship relationship</div></div>
      <div class="stat"><div class="st-num display">${counts.wants}</div><div class="st-lab">want to disciple someone</div></div>
      <div class="stat"><div class="st-num display">4</div><div class="st-lab">generations in the deepest chain</div></div>
    </div>
    <div class="disc-wrap">
      <div class="tree-cols">
        <div class="tree-panel">
          <h2 class="display">Men</h2>
          <ul class="tree">${menRoots.map(r => `<li>${treeNode(r.name)}</li>`).join("")}</ul>
        </div>
        <div class="tree-panel">
          <h2 class="display">Women</h2>
          <ul class="tree">${womenRoots.map(r => `<li>${treeNode(r.name)}</li>`).join("")}</ul>
        </div>
      </div>
      <div class="rail">
        <div class="rail-panel">
          <h2 class="display">Not yet in a relationship</h2>
          <div class="rp-sub">The shepherding list — who needs an introduction?</div>
          <div class="filter-chips">
            ${chipBtn("all", "everyone")}${chipBtn("wants", "wants to disciple")}${chipBtn("open", "open")}${chipBtn("invited", "invited")}${chipBtn("declined", "declined for now")}${chipBtn("none", "not yet invited")}
          </div>
          ${filtered.map(p => `<div class="nd-row">${av(p.name)}
            <div><div class="nd-name">${esc(p.name)}</div><div class="nd-group">${esc(groupById(p.group).name)}</div></div>
            <span class="chip ${STATUS_CLS[p.status]}">${STATUS_LABEL[p.status]}</span></div>`).join("")}
        </div>
        <div class="rail-panel">
          <h2 class="display">A match to make</h2>
          <div class="rp-sub" style="margin-bottom:0">June (Howard's Knob) wants to disciple someone — Marla in her group is open to it. Same gender, same group, same Thursday. ✦</div>
        </div>
      </div>
    </div>`;
}

/* ================= FOLLOW-UP VIEW ================= */
function renderFollowup() {
  const inMotion = GUESTS.filter(g => !g.steps.lifegroup).length;
  const landed = GUESTS.filter(g => g.steps.lifegroup).length;
  const attChip = a => a === "yes" ? `<span class="chip st wants">still attending</span>`
    : a === "sporadic" ? `<span class="chip st invited">sporadic</span>`
    : `<span class="chip st">brand new</span>`;
  const cards = GUESTS.map(g => {
    const miles = MILESTONES.map(([k, lab], i) => {
      const done = g.steps[k];
      const isNext = !done && MILESTONES.slice(0, i).every(([pk]) => g.steps[pk]);
      return `<div class="mile ${done ? "done" : ""} ${isNext ? "next" : ""}"><div class="m-dot">✓</div><div class="m-lab">${lab}</div></div>`;
    }).join("");
    return `<div class="fu-card">
      <div class="fu-top">${avG(g.name, g.gender)}
        <div><div class="fu-name display">${esc(g.name)}</div><div class="fu-desc">${esc(g.desc)}</div></div>
        <div class="fu-right">${attChip(g.attending)}${g.card ? `<span class="chip st">connect card ✓</span>` : ""}<span class="chip st">first Sunday: ${g.first}</span></div>
      </div>
      <div class="fu-contact"><span>✉ ${esc(g.email)}</span><span>☎ ${esc(g.phone)}</span></div>
      <div class="miles">${miles}</div>
      <div class="fu-note">${esc(g.note)}</div>
    </div>`;
  }).join("");

  return `
    <div class="view-head"><div class="vh-text">
      <h1 class="display">Guest follow-up</h1>
      <p>From first Sunday to family — every guest walks the same road: contact → coffee → Discover Antioch → a lifegroup home → discipleship.</p>
    </div></div>
    <div class="fu-stats">
      <div class="stat"><div class="st-num display">${GUESTS.length}</div><div class="st-lab">guests in the pipeline</div></div>
      <div class="stat"><div class="st-num display">${inMotion}</div><div class="st-lab">still in motion</div></div>
      <div class="stat"><div class="st-num display">${landed}</div><div class="st-lab">landed in a lifegroup this year</div></div>
    </div>
    <div class="fu-list">${cards}</div>`;
}

/* ================= CHECK-IN VIEW ================= */
let ciStep = 0;
let ciSel = { rhythm: 0, moods: [], win: null };
const CI_STEPS = 6;
const MOODS = ["Thriving", "Growing", "Warm", "Expectant", "Steady", "Tired", "Stretched", "Scattered", "Stuck"];

function ciNext() { if (ciStep < CI_STEPS - 1) { ciStep++; render(); if (ciStep === CI_STEPS - 1) burst(); } }
function ciBack() { if (ciStep > 0) { ciStep--; render(); } }
function ciPick(key, val, advance) { ciSel[key] = val; if (advance) ciNext(); else render(); }
function ciMood(i) {
  const at = ciSel.moods.indexOf(i);
  if (at >= 0) ciSel.moods.splice(at, 1); else ciSel.moods.push(i);
  render();
}
function ciRestart() { ciStep = 0; ciSel = { rhythm: 0, moods: [], win: null }; render(); }

function renderCheckin() {
  const prog = `<div class="progress">${Array.from({ length: CI_STEPS }, (_, i) => `<span class="pg ${i <= ciStep ? "done" : ""}"></span>`).join("")}</div>`;
  let body = "";
  const opt = (sel, label, onclick) => `<button class="opt ${sel ? "sel" : ""}" onclick="${onclick}">${label}<span class="opt-check">✓</span></button>`;

  if (ciStep === 0) body = `
      <p class="step-q display">Hey Sam — July check-in for King Street</p>
      <p class="step-sub">Everything's pre-filled from last month. Should take about 90 seconds.</p>
      <div class="step-body" style="justify-content:center; text-align:center; color:var(--muted); font-size:13.5px">Last check-in: June 2 · streak: 9 months</div>
      <button class="cta" onclick="ciNext()">Let's go</button>`;

  if (ciStep === 1) body = `
      <div class="step-eyebrow label">Rhythm</div>
      <p class="step-q display">Still Tuesdays 6:30 at your place?</p>
      <div class="step-body">
        ${opt(ciSel.rhythm === 0, "Yep, same as always", "ciPick('rhythm',0,true)")}
        ${opt(ciSel.rhythm === 1, "Something changed", "ciPick('rhythm',1,true)")}
      </div>
      <button class="back" onclick="ciBack()">back</button>`;

  if (ciStep === 2) body = `
      <div class="step-eyebrow label">Roster</div>
      <p class="step-q display">Anyone new since June?</p>
      <p class="step-sub">Corey brought his roommate twice — want to add him?</p>
      <div class="step-body">
        ${opt(false, "＋ Add Corey's roommate", "ciNext()")}
        ${opt(false, "＋ Add someone else", "ciNext()")}
        ${opt(false, "No new faces this month", "ciNext()")}
      </div>
      <button class="back" onclick="ciBack()">back</button>`;

  if (ciStep === 3) body = `
      <div class="step-eyebrow label">Pulse</div>
      <p class="step-q display">How has the group been feeling?</p>
      <p class="step-sub">Pick as many words as fit.</p>
      <div class="step-body"><div class="mood-grid">
        ${MOODS.map((m, i) => `<button class="opt ${ciSel.moods.includes(i) ? "sel" : ""}" onclick="ciMood(${i})">${m}</button>`).join("")}
      </div></div>
      <button class="cta" onclick="ciNext()" ${ciSel.moods.length === 0 ? 'style="opacity:.45" disabled' : ""}>Next</button>
      <button class="back" onclick="ciBack()">back</button>`;

  if (ciStep === 4) body = `
      <div class="step-eyebrow label">Celebrate</div>
      <p class="step-q display">Anything to celebrate?</p>
      <p class="step-sub">Wins go on the church-wide board (you can keep one private too).</p>
      <div class="step-body">
        ${opt(ciSel.win === 0, "Answered prayer", "ciPick('win',0,true)")}
        ${opt(ciSel.win === 1, "Someone met Jesus", "ciPick('win',1,true)")}
        ${opt(ciSel.win === 2, "New discipleship relationship", "ciPick('win',2,true)")}
        ${opt(ciSel.win === 3, "Nothing this month — that's okay", "ciPick('win',3,true)")}
      </div>
      <button class="back" onclick="ciBack()">back</button>`;

  if (ciStep === 5) {
    const words = ciSel.moods.map(i => MOODS[i].toLowerCase());
    const feeling = words.length ? ` — feeling <strong>${words.length > 1 ? words.slice(0, -1).join(", ") + " & " + words[words.length - 1] : words[0]}</strong>` : "";
    body = `
      <div class="finish">
        <svg width="54" height="54" viewBox="0 0 54 54" fill="none" aria-hidden="true">
          <circle cx="27" cy="27" r="25" stroke="var(--accent)" stroke-width="2.5"/>
          <path d="m17 27.5 7 7 13-14" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p class="fin-big display">That's it. 87 seconds.</p>
        <p class="fin-sub">King Street is checked in for July${feeling}. Your win is on the board. See you in August.</p>
        <button class="back" onclick="ciRestart()" style="margin-top:10px">run it again</button>
      </div>`;
  }

  return `
    <div class="view-head"><div class="vh-text">
      <h1 class="display">The monthly check-in</h1>
      <p>${role === "staff" ? "This is what leaders experience — pre-filled, phone-first, under two minutes, ends in celebration." : "Ninety seconds, once a month. That's the whole ask."}</p>
    </div></div>
    <div class="checkin-stage"><div class="phone" id="phone">${prog}${body}</div></div>
    <div class="checkin-note">Diligent leaders can also log attendance and prayer answers any time — but this is the only ask.</div>`;
}

function burst() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  requestAnimationFrame(() => {
    const phone = document.getElementById("phone");
    if (!phone) return;
    const colors = ["var(--accent)", "var(--gold)", "var(--ember)", "var(--tan-ink)"];
    for (let i = 0; i < 26; i++) {
      const d = document.createElement("span");
      d.className = "burst-dot";
      const ang = Math.PI * 2 * (i / 26);
      const dist = 90 + (i % 5) * 28;
      d.style.cssText = `left:50%;top:38%;background:${colors[i % 4]};--dx:${Math.cos(ang) * dist}px;--dy:${Math.sin(ang) * dist}px;`;
      phone.appendChild(d);
      setTimeout(() => d.remove(), 1100);
    }
  });
}

/* ================= RENDER ================= */
function render() {
  renderNav();
  const main = document.getElementById("main");
  if (view === "map") main.innerHTML = renderMap();
  else if (view === "disc") main.innerHTML = renderDisc();
  else if (view === "followup") main.innerHTML = renderFollowup();
  else main.innerHTML = renderCheckin();
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
render();
</script>
